name: Deploy Acionar Frontend v3 to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy Dist to VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "76.13.230.110"
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/acionar-v3/frontend"
          strip_components: 1

      - name: Reload Nginx via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "76.13.230.110"
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl reload nginx
